<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item Detail</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="img/FAVICON.ico" type="image/x-icon">
  
</head>
<body data-page="item-detail">
  <main class="page-shell">
    <div class="nav-shell">
      <header id="site-nav"></header>
    </div>

    <div class="container py-4">
      <header class="detail-topbar">
        <a href="items_list.html" class="back-btn" id="back-link">← Volver al inventario</a>

        <button id="theme-toggle" class="filter-btn" type="button">
          Cambiar oscuro/claro
        </button>
      </header>

      <div id="status" class="status-message">Cargando...</div>
      <section id="item" class="item-detail-wrapper"></section>
    </div>
    <div class="audio-player">
              <audio id="background-audio" autoplay loop>
                <source src="musica/Geneburn - Rules of Engagement.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
              </audio>
              <div class="custom-audio-controls">
                <button id="play-pause-btn" class="audio-btn">
                  <span id="play-icon">▶</span>
                  <span id="pause-icon" style="display: none;">⏸</span>
                </button>
                <div class="progress-container">
                  <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div class="volume-container">
                  <button id="mute-btn" class="audio-btn">🔊</button>
                  <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" class="volume-slider">
                </div>
              </div>
            </div>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
