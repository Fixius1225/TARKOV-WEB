<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarkov Traders</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="traders">
  <main class="landing-page">
    <section class="hero-frame">
      <div class="container-fluid h-100">
        <div class="hero-layout">

          <header id="site-nav"></header>

          <div class="hero-main traders-main">
            <div class="container">
              <div class="traders-content-wrap">

                <div class="traders-title-wrap">
                  <h1 class="traders-title">Traders</h1>
                </div>

                <div class="traders-grid-wrap">
                  <div class="row g-3 justify-content-center">

                    <div class="col-6 col-md-3">
                      <a href="trader_detail.html?trader=prapor" class="trader-card">
                        <div class="trader-portrait">
                          <img src="img/traders/Prapor_Portrait.webp" alt="Prapor">
                        </div>
                        <div class="trader-name">Prapor</div>
                      </a>
                    </div>

                    <div class="col-6 col-md-3">
                      <a href="trader_detail.html?trader=therapist" class="trader-card">
                        <div class="trader-portrait">
                          <img src="img/traders/Therapist_Portrait.webp" alt="Therapist">
                        </div>
                        <div class="trader-name">Therapist</div>
                      </a>
                    </div>

                    <div class="col-6 col-md-3">
                      <a href="trader_detail.html?trader=fence" class="trader-card">
                        <div class="trader-portrait">
                          <img src="img/traders/Fence_Portrait.webp" alt="Fence">
                        </div>
                        <div class="trader-name">Fence</div>
                      </a>
                    </div>

                    <div class="col-6 col-md-3">
                      <a href="trader_detail.html?trader=skier" class="trader-card">
                        <div class="trader-portrait">
                          <img src="img/traders/Skier_Portrait.webp" alt="Skier">
                        </div>
                        <div class="trader-name">Skier</div>
                      </a>
                    </div>

                    <div class="col-6 col-md-3">
                      <a href="trader_detail.html?trader=peacekeeper" class="trader-card">
                        <div class="trader-portrait">
                          <img src="img/traders/Peacekeeper_Portrait.webp" alt="Peacekeeper">
                        </div>
                        <div class="trader-name">Peacekeeper</div>
                      </a>
                    </div>

                    <div class="col-6 col-md-3">
                      <a href="trader_detail.html?trader=mechanic" class="trader-card">
                        <div class="trader-portrait">
                          <img src="img/traders/Mechanic_Portrait.webp" alt="Mechanic">
                        </div>
                        <div class="trader-name">Mechanic</div>
                      </a>
                    </div>

                    <div class="col-6 col-md-3">
                      <a href="trader_detail.html?trader=ragman" class="trader-card">
                        <div class="trader-portrait">
                          <img src="img/traders/Ragman_Portrait.webp" alt="Ragman">
                        </div>
                        <div class="trader-name">Ragman</div>
                      </a>
                    </div>

                    <div class="col-6 col-md-3">
                      <a href="trader_detail.html?trader=jaeger" class="trader-card">
                        <div class="trader-portrait">
                          <img src="img/traders/Jaeger_Portrait.webp" alt="Jaeger">
                        </div>
                        <div class="trader-name">Jaeger</div>
                      </a>
                    </div>

                  </div>
                </div>

              </div>
            </div>
          </div>

          <div class="hero-bottom-zone traders-bottom-zone">
            <div class="cta-wrap traders-cta-wrap">
              <a
                href="https://www.escapefromtarkov.com/purchase"
                target="_blank"
                rel="noopener noreferrer"
                class="buy-card traders-buy-card"
              >
                <div class="row g-0 buy-card-inner">
                  <div class="col-4">
                    <div class="buy-image-placeholder traders-mini-logo">Tarkov</div>
                  </div>
                  <div class="col-4">
                    <div class="buy-copy traders-buy-copy">Buy here</div>
                  </div>
                  <div class="col-4">
                    <div class="buy-image-placeholder">banner</div>
                  </div>
                </div>
              </a>
            </div>

            <div class="bottom-bar traders-bottom-bar"></div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
