<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tarkov Items</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background:#f7f7f7 }
    .card { background:white; padding:12px; margin:8px 0; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.08) }
    .loading { color:#666 }
    .item-img {width: 50%;}
  </style>
</head>
<body>
  
  <div class="row">
    <div class="col">
      <h1 class="col-12 d-flex justify-content-center">Items - Tarkov API</h1>
    </div>
  </div>
  <div id="status" class="loading">Cargando...</div>
<!-- prueba de visionado -->
    <div class="card">
      <div class="row">
        <div class="col-10">
          <a href="item.html">
            <h2><strong>Colt M4A1 5.56x45 assault rifle</strong></h2>
          </a>
          
          <p><small>M4A1</small></p>
        </div>  
        <div class="item-icon col d-flex justify-content-center">
            <img src="prueba.webp" class="item-img" alt="">
        </div>
      </div>
      <div class="row">
        <h2>nueva linea</h2>
      </div>
    </div>  
  <div id="items" class="container"></div>

 

  <script>
    const STATUS = document.getElementById('status');
    const ITEMS_CONTAINER = document.getElementById('items');

    //botones de filtro
    const FILTERS_CONTAINER = document.createElement('div');
    FILTERS_CONTAINER.id = 'filters';
    FILTERS_CONTAINER.style.margin = '8px 0';
    document.body.insertBefore(FILTERS_CONTAINER, ITEMS_CONTAINER);

    // barra de búsqueda (se inserta encima de los filtros)
    const SEARCH_INPUT = document.createElement('input');
    SEARCH_INPUT.id = 'search';
    SEARCH_INPUT.type = 'search';
    SEARCH_INPUT.placeholder = 'Buscar por nombre...';
    SEARCH_INPUT.style.padding = '8px 10px';
    SEARCH_INPUT.style.margin = '0 0 8px 0';
    SEARCH_INPUT.style.width = '100%';
    SEARCH_INPUT.style.maxWidth = '480px';
    SEARCH_INPUT.style.boxSizing = 'border-box';
    document.body.insertBefore(SEARCH_INPUT, FILTERS_CONTAINER);

    let ALL_ITEMS = [];
    let currentFilter = 'All';
    let searchTerm = '';

    //filtros con palabras clave (ajustables)
    const FILTER_PRESETS = {
      'All': [],
      'Weapons': ['rifle','pistol','ak','m4','shotgun','smg','svd','carbine','revolver','gun','mp-','pp-','hk','vector','saiga','tenbox','mosin','bolt','vss','ax','ak74','akm'],
      'Medical': ['medkit','salewa','grizzly','bandage','painkiller','splint','tourniquet','injector','morphine','analgin','bandage','hemostatic','cartridge'],
      'Maps': ['map','shoreline','customs','labs','reserve','woods','interchange','lighthouse','factory','terminal','shoreline','woods'],
      'Other': [] // no entran preset anteriores

    };

    function createFilterButtons() {
      FILTERS_CONTAINER.innerHTML = '';
      Object.keys(FILTER_PRESETS).forEach(name => {
        const btn = document.createElement('button');
        btn.textContent = name;
        btn.className = 'filter-btn' + (name === currentFilter ? ' active' : '');
        btn.style.marginRight = '6px';
        btn.onclick = () => {
          currentFilter = name;
          Array.from(FILTERS_CONTAINER.children).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderItems();
        };
        FILTERS_CONTAINER.appendChild(btn);
      });
    }

    //debounce 
    function debounce(fn, wait) {
      let t;
      return function(...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), wait);
      };
    }

    // manejar input de búsqueda
    SEARCH_INPUT.addEventListener('input', debounce(e => {
      searchTerm = (e.target.value || '').trim().toLowerCase();
      renderItems();
    }, 200));

    //Datos de items que carga la pagina
    async function fetchItems() {
      STATUS.textContent = 'Cargando items...';
      try {
        const query = `{
          items {
            id
            name
            shortName
            iconLink
            basePrice
            avg24hprice
            sellFor {
              price
              currency
              priceRUB
            }
          }
        }`;

        const res = await fetch('https://api.tarkov.dev/graphql', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        if (!res.ok) throw new Error('Respuesta HTTP ' + res.status);

        const json = await res.json();
        const items = json.data && json.data.items ? json.data.items : [];

        ALL_ITEMS = items;
        createFilterButtons();
        renderItems();

      } catch (err) {
        console.error(err);
        STATUS.textContent = 'Error cargando items: ' + (err.message || err);
      }
    }

    // Renderizar JS en la web (Codigo HTML)
    function renderItems() {
      const items = filterItems(ALL_ITEMS, currentFilter, searchTerm);
      STATUS.textContent = items.length ? `Mostrando ${items.length} items (${currentFilter}${searchTerm ? ' · búsqueda: "' + searchTerm + '"' : ''})` : 'No se encontraron items';
      ITEMS_CONTAINER.innerHTML = items.map(it => `
        <div class="card">
          <div class="row">
            <div class="col-10">
              <a href="item.html?id=${encodeURIComponent(it.id)}">
                <h2><strong>${escapeHtml(it.name || '—')}</strong></h2>
              </a>
              
              <p><small>${escapeHtml(it.shortName || '')}</small></p>
            </div>  
            <div class="item-icon col d-flex justify-content-center">
                <img src="${escapeHtml(it.iconLink || '')}" class="item-img" alt="">
            </div>
          </div>
          <div class="row">
            <h2>${mainRubPrice ? formatRUB(mainRubPrice) : 'sin precio'}</h2>
              ${
                euroPrice
                  ? '<p>${formatEUR(euroPrice.price)}</p>'
                  : estimatedEuro
                    ? '<p>${formatEUR(estimatedEuro)}</p>'
                    : ''
              }
          </div>
        </div>  
      `).join('');
    }

    function filterItems(items, filterName, search) {
      if (!items || !items.length) return [];
      let filtered = items;

      if (filterName && filterName !== 'All') {
        const presets = FILTER_PRESETS;
        const lower = s => (s || '').toLowerCase();

        function matchesKeywords(item, keywords) {
          if (!keywords || !keywords.length) return false;
          const text = lower(item.name) + ' ' + lower(item.shortName);
          return keywords.some(k => text.includes(k));
        }

        if (filterName === 'Other') {
          filtered = items.filter(it => {
            return !matchesKeywords(it, presets['Weapons']) &&
                   !matchesKeywords(it, presets['Medical']) &&
                   !matchesKeywords(it, presets['Maps']);
          });
        } else {
          const keywords = presets[filterName] || [];
          filtered = items.filter(it => matchesKeywords(it, keywords));
        }
      }

      if (search) {
        const s = (search || '').toLowerCase();
        filtered = filtered.filter(it => {
          const text = ((it.name || '') + ' ' + (it.shortName || '')).toLowerCase();
          return text.includes(s);
        });
      }

      return filtered;
    }


    // funcion para poner precio en euros
    function formatEUR(value) {
      return new
      Intl.NumberFormat('es-ES', {
        style:'currency',
        currency: 'EUR',
        maximumFractionDigits: 0
      }).format(value);
    }

    function formatRUB(value) {
      return new
      Intl.NumberFormat('es-ES', {
        maximumFractionDigits: 0
      }).format(value) + '₽';
    }

    function getEuroPrices(item) {
      if (!item.sellFor || !item.sellFor.length) return null;
      return item.sellFor.find(p => p.currency === 'EUR') || null;
    }
    function estimatedEuroFromRub(rubValue) {
      const RUB_PER_EUR = 88.67;
      if (!rubValue) return null;
      return rubValue / RUB_PER_EUR;
    }


    
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    //filtro y barra de búsqueda
    const style = document.createElement('style');
    style.textContent = `
      #filters .filter-btn { padding:6px 10px; border-radius:4px; border:1px solid #ddd; background:#fff; cursor:pointer }
      #filters .filter-btn.active { background:#0078D4; color:#fff; border-color:#0063b1 }
      #search { padding:8px 10px; border:1px solid #ddd; border-radius:4px; }
    `;
    document.head.appendChild(style);

    fetchItems();
  </script>
</body>
</html>
