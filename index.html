<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarkov API</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="img/FAVICON.ico" type="image/x-icon">
  
</head>
<body data-page="landing">
  <main class="landing-page">
    <section class="hero-frame">
      <div class="container-fluid h-100">
        <div class="hero-layout">
            
          <header id="site-nav"></header>

          <div class="hero-main">
            <div class="row g-0 w-100">
              <div class="col-12 col-xl-4">
                <div class="left-stack">

                  <div class="logo-block">
                    <img src="img/tarkov_img.png" alt="Escape from Tarkov" class="logo-img">
                  </div>

                  <div class="menu-block">
                    <div class="menu-links">
                      <a href="https://tarkov.dev/api/" class="menu-link">Escape from Tarkov API</a>
                      <a href="items_list.html" class="menu-link">Stash</a>
                      <a href="traders.html" class="menu-link">Traders</a>
                    </div>
                  </div>

                </div>
              </div>

              <div class="col-xl-8 d-none d-xl-block">
                <div class="right-visual-space"></div>
              </div>
            </div>
          </div>
            
          <div class="hero-bottom-zone">
            <div class="cta-wrap">
              <div class="audio-player">
              <audio id="background-audio" autoplay loop>
                <source src="musica/Geneburn - Rules of Engagement.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
              </audio>
              <div class="custom-audio-controls">
                <div class="play-container col-6"> 
                  <button id="play-pause-btn" class="audio-btn">
                    <span id="play-icon">▶</span>
                    <span id="pause-icon" style="display: none;">⏸</span>
                  </button>
                  <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                  </div>
                </div>
                <div class="volume-container col-6">
                  <button id="mute-btn" class="audio-btn">🔊</button>
                  <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" class="volume-slider">
                </div>
              </div>
            </div>
              <a
                href="https://www.escapefromtarkov.com/purchase"
                target="_blank"
                rel="noopener noreferrer"
                class="buy-card"
              >
                <div class="row g-0 buy-card-inner">
                  <div class="col-5">
                    <div class="buy-copy">Buy here</div>
                  </div>
                  <div class="col-7">
                    <div class="buy-image-placeholder banner-image-wrap">
                      <img src="img/buy-tarkov-banner.jpg" alt="Buy Escape from Tarkov" class="banner-img">
                    </div>
                  </div>
                </div>
              </a>
            </div>

            <div class="bottom-bar"></div>
          </div>

        </div>
        
      </div>
    </section>

  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
